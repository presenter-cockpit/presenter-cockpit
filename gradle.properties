# --add-opens: AGP records the ndk-build warnings with Gson, which cannot read these JDK classes without
# them. Here java.lang.ref is enough. The F-Droid build server, which sets ndk.dir and runs JDK 21, also
# needs java.util.concurrent.locks; the other packages are opened as a precaution.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang.ref=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# About half of the development machine's cores, to leave CPU free for the rest during the build.
org.gradle.workers.max=11
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
