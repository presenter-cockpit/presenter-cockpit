# --add-opens: AGP records the ndk-build warnings with Gson, which cannot reach java.lang.ref without it.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 --add-opens=java.base/java.lang.ref=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
# About half of the development machine's cores, to leave CPU free for the rest during the build.
org.gradle.workers.max=11
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
